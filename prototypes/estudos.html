<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Estudos — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  /* Mesmos tokens de src/index.css */
  :root {
    --bg: #f6f5f1; --surface: #ffffff; --surface-2: #f1f0ec; --line: #e6e4de; --line-strong: #d6d3cb;
    --fg: #1b1c19; --muted: #5f625b; --subtle: #8d8f88;
    --accent: #1f5f55; --accent-hover: #184c44; --accent-fg: #f7f5ef; --accent-soft: #1f5f5514; --ring: #1f5f5566;
    --shadow: 0 1px 2px rgb(20 22 18 / 0.04), 0 1px 1px rgb(20 22 18 / 0.03);
    --shadow-lg: 0 12px 32px -8px rgb(20 22 18 / 0.18), 0 2px 6px rgb(20 22 18 / 0.06);
    --ok: #059669; --warn: #b45309;
    color-scheme: light;
  }
  .dark {
    --bg: #0e100f; --surface: #151816; --surface-2: #1b1f1d; --line: #252a27; --line-strong: #323834;
    --fg: #ebece8; --muted: #a3a7a0; --subtle: #747971;
    --accent: #5cbfae; --accent-hover: #74ccbd; --accent-fg: #0b1412; --accent-soft: #5cbfae1c; --ring: #5cbfae55;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
    --shadow-lg: 0 16px 40px -8px rgb(0 0 0 / 0.6), 0 2px 6px rgb(0 0 0 / 0.3);
    --ok: #34d399; --warn: #fbbf24;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; font-size: 14px; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  svg.lucide { flex-shrink: 0; }
  .tabular { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .subtle { color: var(--subtle); }

  /* ---------- Sidebar (igual à real) ---------- */
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 240px; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); z-index: 30; }
  .sb-top { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 16px; flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo b { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .logo .ver { margin-left: 6px; border-radius: 4px; background: var(--surface-2); padding: 2px 4px; font-size: 10px; font-weight: 500; color: var(--subtle); }
  .icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--muted); }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .icon-btn .lucide { width: 16px; height: 16px; }
  .search { margin: 0 12px 8px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-size: 13px; color: var(--subtle); box-shadow: var(--shadow); }
  .search span { flex: 1; text-align: left; }
  .search kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 10.5px; font-family: inherit; }
  .sb-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 12px; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  .nav-item { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted); transition: background .15s, color .15s; width: 100%; }
  .nav-item:hover { background: var(--surface); color: var(--fg); }
  .nav-item .lucide { width: 16px; height: 16px; color: var(--subtle); }
  .nav-item .label { flex: 1; text-align: left; }
  .nav-item .badge { font-size: 11px; color: var(--subtle); }
  .nav-item[aria-current='page'] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
  .nav-item[aria-current='page'] .lucide { color: var(--accent); }
  .nav-item.project { height: 28px; font-size: 13px; font-weight: 400; }
  .pdot { width: 8px; height: 8px; border-radius: 99px; margin: 0 4px; }
  .divider { height: 1px; background: var(--line); margin: 8px 10px; }
  .sec-head { width: 100%; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; border-radius: 6px; font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--subtle); }
  .sec-head:hover { color: var(--muted); }
  .sec-head .title { flex: 1; text-align: left; }
  .sec-head .chev { width: 14px; height: 14px; transition: transform .2s; opacity: .8; }
  .section.open .chev { transform: rotate(180deg); }
  .sec-head .new { font-size: 9.5px; letter-spacing: .02em; text-transform: none; background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 5px; }
  .sec-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease-out; }
  .section.open .sec-panel { grid-template-rows: 1fr; }
  .sec-inner { overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 2px; visibility: hidden; }
  .section.open .sec-inner { visibility: visible; padding: 2px 0 8px; }
  .sb-foot { flex-shrink: 0; border-top: 1px solid var(--line); padding: 12px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 28px; height: 28px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin-left: 10px; }
  .sb-foot .meta { flex: 1; line-height: 1.25; } .sb-foot .meta p { margin: 0; } .sb-foot .meta p:first-child { font-size: 13px; font-weight: 500; } .sb-foot .meta p:last-child { font-size: 11px; color: var(--subtle); }

  /* ---------- Página ---------- */
  main { padding-left: 240px; padding-bottom: 40px; }
  .page { max-width: 1152px; margin: 0 auto; padding: 40px 40px 0; }
  .ph { margin-bottom: 32px; display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
  .crumbs { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--subtle); margin-bottom: 8px; flex-wrap: wrap; }
  .crumbs a { cursor: pointer; } .crumbs a:hover { color: var(--fg); } .crumbs .cur { color: var(--muted); }
  .crumbs .lucide { width: 14px; height: 14px; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ph .desc { margin: 4px 0 0; font-size: 14px; color: var(--muted); max-width: 640px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  h2.sec { font-size: 15px; font-weight: 600; margin: 32px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h2.sec small { font-size: 13px; font-weight: 400; color: var(--subtle); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .card-h { padding: 16px 20px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .card-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-h p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .card-b { padding: 0 20px 18px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; user-select: none; }
  .btn .lucide { width: 16px; height: 16px; }
  .btn.sm { height: 32px; padding: 0 10px; font-size: 13px; gap: 6px; border-radius: 6px; }
  .btn.sm .lucide { width: 14px; height: 14px; }
  .btn.primary { background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
  .btn.secondary:hover { background: var(--surface-2); border-color: var(--line-strong); }
  .btn.ghost { color: var(--muted); } .btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
  .btn.done { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .btn[disabled] { opacity: .5; pointer-events: none; }

  .grid { display: grid; gap: 12px; }
  .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .stat { padding: 16px; display: flex; flex-direction: column; }
  .stat .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .stat .lbl { font-size: 13px; font-weight: 500; color: var(--muted); }
  .stat .ic { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
  .stat .ic .lucide { width: 14px; height: 14px; }
  .stat .val { margin-top: 12px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .stat .hint { margin-top: 4px; font-size: 12px; color: var(--subtle); }

  .bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .4s cubic-bezier(.2,.8,.2,1); }
  .pill { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .pill.ns { background: var(--surface-2); color: var(--muted); }
  .pill.ip { background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--warn); }
  .pill.dn { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
  .pill.soft { background: var(--surface-2); color: var(--muted); font-weight: 400; }

  /* Trilhas */
  .tracks { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .track { padding: 20px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .track:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lg); }
  .ticon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, transparent); flex-shrink: 0; }
  .ticon .lucide { width: 20px; height: 20px; }
  .ticon.lg { width: 48px; height: 48px; border-radius: 12px; } .ticon.lg .lucide { width: 24px; height: 24px; }
  .track h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .track p.d { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .track .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--subtle); }
  .track .meta span { display: inline-flex; align-items: center; gap: 5px; } .track .meta .lucide { width: 13px; height: 13px; }
  .pct { display: flex; align-items: center; gap: 10px; } .pct .bar { flex: 1; } .pct b { font-size: 13px; font-weight: 600; min-width: 36px; text-align: right; }
  .planned { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; font-size: 12.5px; color: var(--subtle); }
  .planned .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--muted); }
  .planned .chip .lucide { width: 13px; height: 13px; color: var(--subtle); }

  /* Fluxo aprender → cliente */
  .flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .flow .st { padding: 14px 16px; position: relative; }
  .flow .st + .st { border-left: 1px solid var(--line); }
  .flow .st .k { font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--subtle); display: flex; align-items: center; gap: 6px; }
  .flow .st .k .lucide { width: 13px; height: 13px; }
  .flow .st .v { margin-top: 6px; font-size: 18px; font-weight: 600; }
  .flow .st .h { font-size: 12px; color: var(--subtle); margin-top: 2px; }
  .flow .st.link { cursor: pointer; } .flow .st.link:hover { background: var(--surface-2); }

  /* Listas */
  .rows > * + * { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; }
  .row.click { cursor: pointer; } .row.click:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
  .num { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--subtle); text-transform: uppercase; }
  .row .main { flex: 1; min-width: 0; }
  .row .t { font-weight: 500; font-size: 14px; }
  .row .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .row .side { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .mini { width: 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--subtle); text-align: right; }
  .check { width: 20px; height: 20px; border-radius: 99px; border: 1.5px solid var(--line-strong); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: transparent; transition: background .15s, border-color .15s; }
  .check .lucide { width: 12px; height: 12px; stroke-width: 3; }
  .check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.check:hover { border-color: var(--ok); }

  .two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .weights { display: flex; flex-direction: column; gap: 12px; }
  .weights .w { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: 10px; font-size: 13px; }
  .weights .w .p { text-align: right; color: var(--muted); }

  /* Aula / exercício */
  .lesson { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
  .block { padding: 18px 20px; }
  .block + .block { border-top: 1px solid var(--line); }
  .block h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--subtle); display: flex; align-items: center; gap: 8px; }
  .block h4 .n { width: 18px; height: 18px; border-radius: 5px; background: var(--surface-2); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; letter-spacing: 0; }
  .block p { margin: 0 0 8px; line-height: 1.65; color: var(--fg); } .block p:last-child { margin-bottom: 0; }
  .block ul { margin: 0; padding-left: 18px; line-height: 1.7; }
  .block .tbd { color: var(--subtle); font-style: italic; }
  .callout { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; line-height: 1.6; }
  .checklist { display: flex; flex-direction: column; gap: 2px; }
  .checklist label { display: flex; align-items: flex-start; gap: 10px; padding: 7px 8px; border-radius: 6px; cursor: pointer; line-height: 1.45; }
  .checklist label:hover { background: var(--surface-2); }
  .checklist input { margin: 2px 0 0; accent-color: var(--accent); width: 15px; height: 15px; }
  .checklist label.on span { color: var(--subtle); text-decoration: line-through; }
  textarea, input[type=text], input[type=search], input[type=date], input[type=number], input[type=url], select {
    width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  textarea.tall { min-height: 280px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px; }
  .saved { font-size: 12px; color: var(--subtle); display: inline-flex; align-items: center; gap: 5px; }
  .saved .lucide { width: 12px; height: 12px; }
  .toc { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .toc .lnk { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; color: var(--muted); cursor: pointer; text-align: left; width: 100%; }
  .toc .lnk:hover { background: var(--surface-2); color: var(--fg); }
  .toc .lnk.cur { background: var(--surface-2); color: var(--fg); font-weight: 500; }
  .toc .lnk .check { width: 16px; height: 16px; } .toc .lnk .check .lucide { width: 10px; height: 10px; }

  /* Biblioteca */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar .grow { flex: 1; min-width: 200px; position: relative; }
  .toolbar .grow .lucide { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--subtle); }
  .toolbar .grow input { padding-left: 32px; height: 36px; }
  .toolbar select { width: auto; height: 36px; padding: 0 10px; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); flex-wrap: wrap; }
  .seg button { height: 28px; padding: 0 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .seg button[aria-pressed='true'] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  .lib { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .li { padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; }
  .li .hd { display: flex; align-items: center; gap: 8px; }
  .li .ty { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .li .ty .lucide { width: 13px; height: 13px; color: var(--accent); }
  .li h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .li .body { font-size: 13px; color: var(--muted); line-height: 1.55; flex: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .li .ft { display: flex; align-items: center; gap: 4px; }
  .li .ft .sp { flex: 1; display: flex; gap: 4px; flex-wrap: wrap; }

  .empty { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .empty .lucide { width: 28px; height: 28px; color: var(--subtle); margin-bottom: 8px; }

  /* Gráfico */
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 8px; }
  .chart .c { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .chart .b { width: 100%; max-width: 28px; border-radius: 4px 4px 2px 2px; background: var(--accent); min-height: 2px; opacity: .9; }
  .chart .b.z { background: var(--line); }
  .chart .x { font-size: 10.5px; color: var(--subtle); }
  .chart .c:hover .b { opacity: 1; }

  /* Modal + toast */
  .overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .4); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; animation: fade .15s ease-out; }
  .modal { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); animation: pop .18s cubic-bezier(.2,.8,.2,1); max-height: calc(100vh - 32px); overflow: auto; }
  .modal .mh { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; }
  .modal .mh h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .modal form { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; } .field > span { font-size: 13px; font-weight: 500; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 60; box-shadow: var(--shadow-lg); animation: pop .18s; display: flex; align-items: center; gap: 8px; }
  .toast .lucide { width: 14px; height: 14px; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98) } }
  .toast { animation: none; }

  /* Controles do protótipo */
  .proto { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: var(--shadow-lg); align-items: center; }
  .proto span { font-size: 11px; color: var(--subtle); padding: 0 6px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }

  .mobile-top { display: none; }
  @media (max-width: 1180px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .lib { grid-template-columns: repeat(2, minmax(0, 1fr)); } .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); } .flow .st:nth-child(4) { border-left: 0; } .flow .st:nth-child(n+4) { border-top: 1px solid var(--line); } }
  @media (max-width: 1023px) {

  const eDone = exs.filter((e) => S.exercises[e.id]?.done).length
  const pDone = t.project ? Object.values(S.projects[t.project.id]?.steps || {}).filter(Boolean).length : 0
  const lp = lessons.length ? lDone / lessons.length : 0, ep = exs.length ? eDone / exs.length : 0, pp = steps ? pDone / steps : 0
  const progress = Math.round((lp * WEIGHTS.lessons + ep * WEIGHTS.exercises + pp * WEIGHTS.project) * 100)
  const minutes = S.hours.filter((h) => h.trackId === t.id).reduce((n, h) => n + h.minutes, 0)
  return { lessons: lessons.length, lDone, exs: exs.length, eDone, steps, pDone, lp, ep, pp, progress, minutes, projectDone: steps > 0 && pDone === steps, streak: streak(t.id) }
}
function moduleStats(m) {
  const lDone = m.lessons.filter((l) => S.lessons[l.id]?.done).length
  const exDone = !!S.exercises[m.exercise.id]?.done
  const total = m.lessons.length + 1
  return { lDone, exDone, pct: Math.round(((lDone + (exDone ? 1 : 0)) / total) * 100) }
}
function statusOf(pct) { return pct >= 100 ? ['dn', 'Concluído'] : pct > 0 ? ['ip', 'Em andamento'] : ['ns', 'Não iniciado'] }
function activityDays(trackId) {
  const days = new Set()
  const inTrack = (id) => !trackId || id.startsWith(trackId + '.')
  S.hours.forEach((h) => (!trackId || h.trackId === trackId) && days.add(h.date))
  Object.entries(S.lessons).forEach(([id, v]) => v.done && v.doneAt && inTrack(id) && days.add(v.doneAt))
  Object.entries(S.exercises).forEach(([id, v]) => v.done && v.doneAt && inTrack(id) && days.add(v.doneAt))
  return days
}
/** Dias seguidos com estudo (horas registradas ou aula/exercício concluído). Hoje ainda vazio não quebra a sequência. */
function streak(trackId) {
  const days = activityDays(trackId)
  let n = 0, i = days.has(today()) ? 0 : 1
  while (days.has(daysAgo(i))) { n++; i++ }
  return n
}
function overall() {
  const all = ACTIVE_TRACKS.map(trackStats)
  const sum = (k) => all.reduce((n, s) => n + s[k], 0)
  const r = (a, b) => (b ? a / b : 0)
  const progress = Math.round((r(sum('lDone'), sum('lessons')) * WEIGHTS.lessons + r(sum('eDone'), sum('exs')) * WEIGHTS.exercises + r(sum('pDone'), sum('steps')) * WEIGHTS.project) * 100)
  return { progress, minutes: S.hours.reduce((n, h) => n + h.minutes, 0), lDone: sum('lDone'), lessons: sum('lessons'), eDone: sum('eDone'), exs: sum('exs'), projDone: all.filter((s) => s.projectDone).length, projects: all.length, pDone: sum('pDone'), streak: streak() }
}
const fmtH = (min) => { const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h}h${String(m).padStart(2, '0')}` : `${h}h`) : `${m}min` }
const fmtDate = (iso) => iso.split('-').reverse().join('/')
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const pad2 = (n) => String(n).padStart(2, '0')

function statsGrid(s, scope) {
  return `<div class="grid stats">
    ${stat('Progresso geral', `${s.progress}%`, 'gauge', scope)}
    ${stat('Horas estudadas', fmtH(s.minutes), 'clock', 'registradas')}
    ${stat('Aulas concluídas', `${s.lDone}<span class="subtle" style="font-size:14px;font-weight:500">/${s.lessons}</span>`, 'book-open-check')}
    ${stat('Exercícios', `${s.eDone}<span class="subtle" style="font-size:14px;font-weight:500">/${s.exs}</span>`, 'pencil-line', 'concluídos')}
    ${stat('Projetos', s.projects != null ? `${s.projDone}<span class="subtle" style="font-size:14px;font-weight:500">/${s.projects}</span>` : `${s.pDone}<span class="subtle" style="font-size:14px;font-weight:500">/${s.steps}</span>`, 'target', s.projects != null ? 'concluídos' : 'etapas do projeto final')}
    ${stat('Sequência atual', `${s.streak} ${s.streak === 1 ? 'dia' : 'dias'}`, 'flame', s.streak ? 'continue hoje!' : 'estude hoje para começar')}

}

function hoursChart(trackId) {
  const days = Array.from({ length: 14 }, (_, i) => daysAgo(13 - i))
  const per = days.map((d) => S.hours.filter((h) => h.date === d && (!trackId || h.trackId === trackId)).reduce((n, h) => n + h.minutes, 0))
  const max = Math.max(60, ...per)
  return `<div class="chart" role="img" aria-label="Horas estudadas nos últimos 14 dias">${days.map((d, i) => `<div class="c" title="${fmtDate(d)} — ${per[i] ? fmtH(per[i]) : 'sem registro'}"><div class="b ${per[i] ? '' : 'z'}" style="height:${Math.max(2, (per[i] / max) * 120)}px"></div><span class="x">${d.slice(8)}</span></div>`).join('')}</div>`
}
function hoursList(trackId, limit = 6) {
  const list = S.hours.filter((h) => !trackId || h.trackId === trackId).sort((a, b) => b.date.localeCompare(a.date)).slice(0, limit)
  if (!list.length) return `<div class="empty" style="padding:24px">${icon('clock')}<div>Nenhuma hora registrada ainda.</div></div>`
  return `<div class="rows">${list.map((h) => `<div class="row" style="padding:10px 20px"><div class="main"><div class="t tabular" style="font-size:13.5px">${fmtDate(h.date)} · ${fmtH(h.minutes)} <span class="subtle" style="font-weight:400">· ${esc(trackById(h.trackId)?.title || '')}</span></div>${h.note ? `<div class="s">${esc(h.note)}</div>` : ''}</div><button class="icon-btn" data-del-hour="${h.id}" aria-label="Excluir registro">${icon('trash-2')}</button></div>`).join('')}</div>`
}

/** Próxima aula não concluída (ou o exercício pendente do módulo) */
function nextStep(t) {
  for (const m of t.modules) {
    const l = m.lessons.find((l) => !S.lessons[l.id]?.done)
    if (l) return { view: 'lesson', trackId: t.id, moduleId: m.id, lessonId: l.id }
    if (!S.exercises[m.exercise.id]?.done) return { view: 'exercise', trackId: t.id, moduleId: m.id }
  }
  return { view: 'project', trackId: t.id }
}

  ]
  return `
  ${crumbs([{ label: 'Estudos', go: { view: 'studies' } }, { label: t.title, go: { view: 'track', trackId: t.id } }, { label: `Módulo ${pad2(m.number)}`, go: { view: 'module', trackId: t.id, moduleId: m.id } }, { label: `Aula ${idx + 1}` }])}
  <div class="ph"><div><div class="num" style="margin-bottom:4px">Módulo ${pad2(m.number)} · Aula ${idx + 1} de ${m.lessons.length}</div><h1>${l.title}</h1></div>
    <div class="actions"><span class="saved" id="saved"></span></div></div>
  <div class="lesson">
    <div class="card">${blocks.map(([h, b], i) => `<section class="block"><h4><span class="n">${i + 2}</span>${h}</h4>${b}</section>`).join('')}
      <section class="block" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="muted" style="font-size:13px">${st.done ? `Concluída em ${fmtDate(st.doneAt)}` : 'Terminou? Marque a aula como concluída.'}</span>
        <button class="btn ${st.done ? 'done' : 'primary'}" data-complete-lesson>${icon(st.done ? 'check-circle-2' : 'check')}${st.done ? 'Aula concluída' : 'Concluir aula'}</button>
      </section>
    </div>
    <aside class="toc">
      <div class="card" style="padding:8px">
        <div class="num" style="padding:8px 12px 6px">Aulas do módulo</div>
        ${m.lessons.map((x, i) => `<button class="lnk ${x.id === l.id ? 'cur' : ''}" ${goAttr({ view: 'lesson', trackId: t.id, moduleId: m.id, lessonId: x.id })}><span class="check ${S.lessons[x.id]?.done ? 'on' : ''}">${icon('check')}</span>${i + 1}. ${x.title}</button>`).join('')}
        <button class="lnk" ${goAttr({ view: 'exercise', trackId: t.id, moduleId: m.id })}><span class="check ${S.exercises[m.exercise.id]?.done ? 'on' : ''}">${icon('check')}</span>Exercício: ${m.exercise.title}</button>
      </div>
      <button class="btn secondary" data-log-hours="${t.id}" style="justify-content:center">${icon('clock')}Registrar horas</button>
    </aside>
  </div>`
}

function pageExercise() {
  const t = trackById(R.trackId), m = t.modules.find((x) => x.id === R.moduleId), e = m.exercise
  const st = S.exercises[e.id] || {}
  return `
  ${crumbs([{ label: 'Estudos', go: { view: 'studies' } }, { label: t.title, go: { view: 'track', trackId: t.id } }, { label: `Módulo ${pad2(m.number)}`, go: { view: 'module', trackId: t.id, moduleId: m.id } }, { label: 'Exercício' }])}
  <div class="ph"><div><div class="num" style="margin-bottom:4px">Exercício do módulo ${pad2(m.number)}</div><h1>${e.title} ${st.done ? '<span class="pill dn">Concluído</span>' : st.answer ? '<span class="pill ip">Em andamento</span>' : ''}</h1></div>
    <div class="actions"><span class="saved" id="saved">${st.savedAt ? `${icon('check')}Salvo às ${st.savedAt}` : ''}</span></div></div>
  <div class="lesson">
    <div class="card">
      <section class="block"><h4>Instruções</h4><p>${e.instructions}</p></section>
      <section class="block">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px"><h4 style="margin:0">Sua resposta</h4>${e.template ? `<button class="btn sm ghost" data-template>${icon('file-plus-2')}Inserir modelo</button>` : ''}</div>
        <textarea class="tall" data-autosave="exercise-answer" placeholder="Escreva sua resposta. Tudo é salvo automaticamente.">${esc(st.answer)}</textarea>
      </section>
      <section class="block" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="muted" style="font-size:13px">${st.done ? `Concluído em ${fmtDate(st.doneAt)}` : 'Salvo automaticamente enquanto você escreve.'}</span>
        <button class="btn ${st.done ? 'done' : 'primary'}" data-complete-exercise>${icon(st.done ? 'check-circle-2' : 'check')}${st.done ? 'Exercício concluído' : 'Marcar como concluído'}</button>
      </section>
    </div>
    <aside class="toc"><div class="card" style="padding:14px 12px">
      <div class="num" style="padding:0 8px 8px">Checklist</div>
      <div class="checklist">${(e.checklist || []).map((c, i) => { const on = (st.checks || []).includes(i); return `<label class="${on ? 'on' : ''}"><input type="checkbox" data-echeck="${i}" ${on ? 'checked' : ''}><span>${c}</span></label>` }).join('')}</div>
    </div>
    <button class="btn secondary" data-save-lib style="justify-content:center">${icon('library')}Salvar resposta na Biblioteca</button></aside>
  </div>`
}

function pageProject() {
  const t = trackById(R.trackId), p = t.project, st = S.projects[p.id] || { steps: {} }
  const done = Object.values(st.steps).filter(Boolean).length, pct = Math.round((done / p.steps.length) * 100)
  return `
  ${crumbs([{ label: 'Estudos', go: { view: 'studies' } }, { label: t.title, go: { view: 'track', trackId: t.id } }, { label: 'Projeto final' }])}
  <div class="ph"><div><div class="num" style="margin-bottom:4px">${t.title} · Projeto final</div><h1>${p.title.replace(/^Projeto Final — /, '')} ${pill(pct)}</h1><p class="desc">${p.description}</p></div></div>
  <div class="card" style="padding:18px 20px;margin-bottom:16px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><span class="muted">${done} de ${p.steps.length} etapas concluídas</span><b class="tabular">${pct}%</b></div>${bar(pct)}</div>
  <div class="card rows">${p.steps.map((s, i) => {
    const on = !!st.steps[i]
    return `<div class="row"><button class="check ${on ? 'on' : ''}" data-step="${i}" aria-pressed="${on}" aria-label="Marcar etapa ${i + 1}">${icon('check')}</button>
      <div class="main"><div class="t" style="${on ? 'color:var(--subtle);text-decoration:line-through' : ''}"><span class="subtle tabular" style="font-weight:500">${pad2(i + 1)}</span>&nbsp; ${s}</div></div>
      ${i === p.steps.length - 1 ? `<span class="pill soft">${icon('briefcase', 'width:12px;height:12px')}vira case no portfólio</span>` : ''}</div>`
  }).join('')}</div>
  ${pct === 100 ? `<div class="card" style="margin-top:16px;padding:18px 20px;display:flex;gap:14px;align-items:center;border-color:color-mix(in srgb,var(--ok) 40%,var(--line))"><div class="ticon" style="--tc:var(--ok)">${icon('trophy')}</div><div class="main" style="flex:1"><div class="t">Projeto concluído!</div><div class="s">No app, este case poderá ser enviado para a Biblioteca e usado nas propostas para clientes.</div></div></div>` : ''}`
}

function pageStudyProjects() {
  return `
  <div class="ph"><div><h1>Projetos de estudo</h1><p class="desc">Projetos práticos das trilhas — cada um termina como um case para o seu portfólio.</p></div></div>
  <div class="card rows">${ACTIVE_TRACKS.map((t) => {
    const s = trackStats(t)
    return `<div class="row click" style="--tc:${t.color}" ${goAttr({ view: 'project', trackId: t.id })}><div class="ticon">${icon(t.icon)}</div>
      <div class="main"><div class="t">${t.project.title.replace(/^Projeto Final — /, '')}</div><div class="s">${t.title}</div></div>
      <div class="side"><div class="mini"><span class="tabular">${s.pDone}/${s.steps} etapas</span>${bar(Math.round(s.pp * 100))}</div>${pill(Math.round(s.pp * 100))}</div></div>`
  }).join('')}</div>
  <p class="subtle" style="font-size:13px;margin-top:12px">Em breve: projetos livres (fora das trilhas) e ligação com Clientes e Projetos do Business OS.</p>`
}

let LIB = { q: '', type: '', track: '' }
function pageLibrary() {
  const q = LIB.q.trim().toLowerCase()
  const list = S.library.filter((i) => (!LIB.type || i.type === LIB.type) && (!LIB.track || (LIB.track === 'geral' ? !i.trackId : i.trackId === LIB.track)) && (!q || [i.title, i.content, i.tags, i.url].join(' ').toLowerCase().includes(q)))
  return `
  <div class="ph"><div><h1>Biblioteca</h1><p class="desc">Prompts, templates, referências e materiais — disponíveis para todas as trilhas.</p></div>
    <div class="actions"><button class="btn primary" data-lib-new>${icon('plus')}Novo item</button></div></div>
  <div class="toolbar">
    <div class="grow">${icon('search')}<input type="search" id="lib-q" placeholder="Pesquisar na biblioteca…" value="${esc(LIB.q)}"></div>
    <select id="lib-track" aria-label="Filtrar por trilha"><option value="">Todas as trilhas</option><option value="geral" ${LIB.track === 'geral' ? 'selected' : ''}>Geral (sem trilha)</option>${ACTIVE_TRACKS.map((t) => `<option value="${t.id}" ${LIB.track === t.id ? 'selected' : ''}>${t.title}</option>`).join('')}</select>
  </div>
  <div class="seg" role="group" aria-label="Filtrar por tipo" style="margin-bottom:16px"><button data-lib-type="" aria-pressed="${!LIB.type}">Todos</button>${LIB_TYPES.map((t) => `<button data-lib-type="${t.id}" aria-pressed="${LIB.type === t.id}">${t.label}</button>`).join('')}</div>
  ${list.length ? `<div class="grid lib">${list.map((i) => {
    const ty = libType(i.type), tr = trackById(i.trackId)
    return `<article class="card li"><div class="hd"><span class="ty">${icon(ty.icon)}${ty.one}</span><span style="flex:1"></span>${tr ? `<span class="pill soft">${tr.title}</span>` : ''}</div>
      <h3>${esc(i.title)}</h3><div class="body">${esc(i.content || i.url)}</div>
      <div class="ft"><div class="sp">${(i.tags || '').split(',').map((x) => x.trim()).filter(Boolean).map((x) => `<span class="subtle" style="font-size:12px">#${esc(x)}</span>`).join('')}</div>
        ${i.url ? `<a class="icon-btn" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer" title="Abrir link" aria-label="Abrir link">${icon('external-link')}</a>` : ''}
        <button class="icon-btn" data-lib-copy="${i.id}" title="Copiar" aria-label="Copiar">${icon('copy')}</button>
        <button class="icon-btn" data-lib-edit="${i.id}" title="Editar" aria-label="Editar">${icon('pencil')}</button>
        <button class="icon-btn" data-lib-del="${i.id}" title="Excluir" aria-label="Excluir">${icon('trash-2')}</button></div></article>`
  }).join('')}</div>` : `<div class="card empty">${icon('library')}<div>${S.library.length ? 'Nada encontrado com esses filtros.' : 'Sua biblioteca está vazia. Adicione o primeiro item.'}</div></div>`}`
}

/* =====================================================================
 * 6. INTERAÇÕES
 * ===================================================================== */
let saveTimer
document.addEventListener('input', (e) => {
  const el = e.target
  if (el.id === 'lib-q') { LIB.q = el.value; const pos = el.selectionStart; render(); const n = document.getElementById('lib-q'); n.focus(); n.setSelectionRange(pos, pos); return }
  const kind = el.dataset.autosave
  if (!kind) return
  const saved = document.getElementById('saved')
  if (saved) saved.innerHTML = 'Salvando…'
  clearTimeout(saveTimer)
  saveTimer = setTimeout(() => {
    const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
    if (kind.startsWith('lesson')) { const st = (S.lessons[R.lessonId] ||= {}); st[kind === 'lesson-notes' ? 'notes' : 'answer'] = el.value }
    else { const st = (S.exercises[R.moduleId + '.ex'] ||= {}); st.answer = el.value; st.savedAt = time }
    save()
    if (saved) { saved.innerHTML = `${icon('check')}Salvo às ${time}`; lucide.createIcons() }
  }, 500)
})
document.addEventListener('change', (e) => {
  const el = e.target
  if (el.id === 'lib-track') { LIB.track = el.value; return render() }
  const toggleIn = (arr, i, on) => (on ? [...new Set([...(arr || []), i])] : (arr || []).filter((x) => x !== i))
  if (el.dataset.lcheck != null) { const st = (S.lessons[R.lessonId] ||= {}); st.checks = toggleIn(st.checks, +el.dataset.lcheck, el.checked); save(); el.closest('label').classList.toggle('on', el.checked) }
  if (el.dataset.echeck != null) { const st = (S.exercises[R.moduleId + '.ex'] ||= {}); st.checks = toggleIn(st.checks, +el.dataset.echeck, el.checked); save(); el.closest('label').classList.toggle('on', el.checked) }
})
document.addEventListener('click', (e) => {
  const el = e.target.closest('button, [role=link]')
  if (!el) return
  if (el.hasAttribute('data-complete-lesson')) {
    const st = (S.lessons[R.lessonId] ||= {}); st.done = !st.done; st.doneAt = st.done ? today() : null; save()
    if (st.done) {
      toast('Aula concluída! Progresso atualizado.')
      const t = trackById(R.trackId), m = t.modules.find((x) => x.id === R.moduleId), i = m.lessons.findIndex((l) => l.id === R.lessonId)
      return go(m.lessons[i + 1] ? { ...R, lessonId: m.lessons[i + 1].id } : { view: 'exercise', trackId: t.id, moduleId: m.id })
    }
    return render()
  }
  if (el.hasAttribute('data-complete-exercise')) { const st = (S.exercises[R.moduleId + '.ex'] ||= {}); st.done = !st.done; st.doneAt = st.done ? today() : null; save(); render(); if (st.done) toast('Exercício concluído!') }
  if (el.hasAttribute('data-template')) {
    const t = trackById(R.trackId), m = t.modules.find((x) => x.id === R.moduleId), ta = document.querySelector('[data-autosave="exercise-answer"]')
    ta.value = ta.value.trim() ? `${ta.value.trimEnd()}\n\n${m.exercise.template}` : m.exercise.template
    ta.dispatchEvent(new Event('input', { bubbles: true })); ta.focus(); toast('Modelo inserido')
  }
  if (el.hasAttribute('data-save-lib')) {
    const t = trackById(R.trackId), m = t.modules.find((x) => x.id === R.moduleId)
    const answer = S.exercises[m.exercise.id]?.answer
    if (!answer?.trim()) return toast('Escreva a resposta primeiro', 'info')
    S.library.unshift({ id: uid(), type: 'material', title: `Exercício — ${m.exercise.title}`, trackId: t.id, url: '', tags: 'exercício', content: answer }); save(); toast('Salvo na Biblioteca')
  }
  if (el.dataset.step != null) { const p = trackById(R.trackId).project.id; const st = (S.projects[p] ||= { steps: {} }); st.steps[el.dataset.step] = !st.steps[el.dataset.step]; save(); render() }
  if (el.hasAttribute('data-log-hours')) hoursModal(el.dataset.logHours || R.trackId)
  if (el.dataset.libType != null) { LIB.type = el.dataset.libType; render() }
  if (el.hasAttribute('data-lib-new')) libModal()
  if (el.dataset.libEdit) libModal(S.library.find((i) => i.id === el.dataset.libEdit))
  if (el.dataset.libDel) { if (confirm('Excluir este item da Biblioteca?')) { S.library = S.library.filter((i) => i.id !== el.dataset.libDel); save(); render(); toast('Item excluído') } }
  if (el.dataset.libCopy) { const i = S.library.find((x) => x.id === el.dataset.libCopy); copy(i.content || i.url) }
})
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=link][data-go]')) { e.preventDefault(); go(JSON.parse(e.target.dataset.go)) }
  if (e.key === 'Escape') closeModal()
})

function copy(text) {
  const done = () => toast('Copiado para a área de transferência')
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback)
  else fallback()
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done() } catch { toast('Não foi possível copiar', 'info') } ta.remove() }
}

/* Modais */
function modal(title, body, onSubmit) {
  document.getElementById('modal-root').innerHTML = `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mh"><h3 id="mt">${title}</h3><button class="icon-btn" data-close aria-label="Fechar">${icon('x')}</button></div><form novalidate>${body}<div class="mf"><button type="button" class="btn secondary" data-close>Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div></div>`
  lucide.createIcons()
  const root = document.getElementById('modal-root')
  root.querySelector('form').onsubmit = (e) => { e.preventDefault(); if (onSubmit(new FormData(e.target)) !== false) closeModal() }
  root.querySelector('[data-overlay]').addEventListener('mousedown', (e) => { if (e.target.matches('[data-overlay]')) closeModal() })
  root.querySelectorAll('[data-close]').forEach((b) => (b.onclick = closeModal))
  root.querySelector('input, select, textarea')?.focus()
}
function closeModal() { document.getElementById('modal-root').innerHTML = '' }

function hoursModal(trackId) {
  modal('Registrar horas de estudo', `
    <div class="field-row"><label class="field"><span>Data</span><input type="date" name="date" value="${today()}" max="${today()}" required></label>
    <label class="field"><span>Tempo</span><div style="display:flex;gap:8px"><input type="number" name="h" min="0" max="16" value="1" aria-label="Horas" style="width:50%"><select name="m" aria-label="Minutos" style="width:50%">${[0, 15, 30, 45].map((m) => `<option value="${m}" ${m === 30 ? 'selected' : ''}>${m} min</option>`).join('')}</select></div></label></div>
    <label class="field"><span>Trilha</span><select name="track">${ACTIVE_TRACKS.map((t) => `<option value="${t.id}" ${t.id === trackId ? 'selected' : ''}>${t.title}</option>`).join('')}</select></label>
    <label class="field"><span>Observação <span class="subtle" style="font-weight:400">(opcional)</span></span><input type="text" name="note" maxlength="200" placeholder="Ex.: Estudei planejamento de conteúdo."></label>`, (f) => {
    const minutes = (+f.get('h') || 0) * 60 + (+f.get('m') || 0)
    if (!minutes) { toast('Informe o tempo estudado', 'info'); return false }
    S.hours.push({ id: uid(), date: f.get('date') || today(), minutes, trackId: f.get('track'), note: String(f.get('note') || '').trim() }); save(); render(); toast(`${fmtH(minutes)} registradas`)
  })
}
function libModal(item) {
  const i = item || { type: 'prompt', title: '', trackId: R.trackId || '', url: '', tags: '', content: '' }
  modal(item ? 'Editar item' : 'Novo item na Biblioteca', `
    <div class="field-row"><label class="field"><span>Tipo</span><select name="type">${LIB_TYPES.map((t) => `<option value="${t.id}" ${t.id === i.type ? 'selected' : ''}>${t.one}</option>`).join('')}</select></label>
    <label class="field"><span>Trilha</span><select name="trackId"><option value="">Geral (todas)</option>${ACTIVE_TRACKS.map((t) => `<option value="${t.id}" ${t.id === i.trackId ? 'selected' : ''}>${t.title}</option>`).join('')}</select></label></div>
    <label class="field"><span>Título</span><input type="text" name="title" maxlength="140" value="${esc(i.title)}" required></label>
    <label class="field"><span>Link <span class="subtle" style="font-weight:400">(opcional)</span></span><input type="url" name="url" placeholder="https://" value="${esc(i.url)}"></label>
    <label class="field"><span>Conteúdo</span><textarea name="content" placeholder="Texto do prompt, template, anotações…">${esc(i.content)}</textarea></label>
    <label class="field"><span>Tags <span class="subtle" style="font-weight:400">(separadas por vírgula)</span></span><input type="text" name="tags" value="${esc(i.tags)}"></label>`, (f) => {
    const title = String(f.get('title') || '').trim()
    if (!title) { toast('Dê um título ao item', 'info'); return false }
    const url = String(f.get('url') || '').trim()
    if (url && !/^https?:\/\//i.test(url)) { toast('O link deve começar com http:// ou https://', 'info'); return false }
    const data = { type: f.get('type'), trackId: f.get('trackId'), title, url, content: String(f.get('content') || ''), tags: String(f.get('tags') || '') }
    if (item) Object.assign(item, data); else S.library.unshift({ id: uid(), ...data })
    save(); render(); toast(item ? 'Item atualizado' : 'Item adicionado')
  })
}

let toastTimer
function toast(msg, kind) {
  document.querySelector('.toast')?.remove()
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status')
  el.innerHTML = `${icon(kind === 'info' ? 'info' : 'check')}${esc(msg)}`
  document.body.appendChild(el); lucide.createIcons()
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2200)
}

/* =====================================================================
 * 7. RENDER
 * ===================================================================== */
const PAGES = { studies: pageStudies, track: pageTrack, module: pageModule, lesson: pageLesson, exercise: pageExercise, project: pageProject, library: pageLibrary, 'study-projects': pageStudyProjects }
function render() {
  renderNav()
  document.getElementById('page').innerHTML = PAGES[R.view]()
  lucide.createIcons()
}

document.getElementById('theme').onclick = () => document.documentElement.classList.toggle('dark')
document.getElementById('reset').onclick = () => { if (confirm('Limpar todo o progresso e a biblioteca do protótipo?')) { S = emptyState(); save(); go({ view: 'studies' }); toast('Dados limpos') } }
document.getElementById('seed').onclick = () => { S = demoState(); save(); go({ view: 'studies' }); toast('Dados de exemplo carregados') }
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')
render()
</script>
